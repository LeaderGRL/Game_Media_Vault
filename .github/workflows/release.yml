name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  source-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if test "$EVENT_NAME" = "workflow_dispatch"; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Create source archives
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="game-media-vault-$TAG/" -o "dist/game-media-vault-$TAG.tar.gz" "$TAG"
          git archive --format=zip --prefix="game-media-vault-$TAG/" -o "dist/game-media-vault-$TAG.zip" "$TAG"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes

