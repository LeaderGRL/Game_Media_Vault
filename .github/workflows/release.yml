name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if test "$EVENT_NAME" = "workflow_dispatch"; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify tagged source
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Test frontend
        working-directory: ui
        run: npm test

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features --locked

  desktop:
    name: Build ${{ matrix.target }}
    needs: [resolve, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      # Every target must build, or no release is published.
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: .exe
            pdfium: win-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: ""
            pdfium: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: ""
            pdfium: mac-arm64

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # Builds the frontend first, then the app with its assets embedded.
      - name: Build desktop app
        working-directory: ui
        # `--locked` refuses a Cargo.lock that differs from the tagged one instead of rewriting it.
        run: npm run tauri -- build --no-bundle --target ${{ matrix.target }} -- --locked

      - name: Build CLI
        run: cargo build --release --locked -p game-media-vault-cli --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
          PDFIUM: ${{ matrix.pdfium }}
        run: |
          name="game-media-vault-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/game-media-vault-tauri$EXECUTABLE" "dist/$name/game-media-vault-desktop$EXECUTABLE"
          cp "target/$TARGET/release/game-media-vault$EXECUTABLE" "dist/$name/game-media-vault$EXECUTABLE"
          # The pinned pdfium, beside the executables where the application looks for it (ADR 0006).
          bash scripts/fetch-pdfium.sh "$PDFIUM" "dist/$name"
          cd dist
          if test "$RUNNER_OS" = "Windows"; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [resolve, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Create source archives
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="game-media-vault-$TAG/" -o "dist/game-media-vault-$TAG.tar.gz" "$TAG"
          git archive --format=zip --prefix="game-media-vault-$TAG/" -o "dist/game-media-vault-$TAG.zip" "$TAG"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
