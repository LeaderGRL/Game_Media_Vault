name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review pull request
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    env:
      # Reviews run once a Claude credential is configured; until then the job is skipped.
      HAS_CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Report missing Claude credential
        if: env.HAS_CLAUDE_CREDENTIAL != 'true'
        run: echo "::notice::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable Claude reviews."

      - name: Checkout repository
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review with Claude
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request of Game Media Vault. Read AGENTS.md, CONTEXT.md, the
            sections of docs/SPEC.md the change touches and the ADRs under docs/adr/ first, then
            the diff (`gh pr diff`).

            Report only defects you are confident about: behaviour that contradicts the request,
            the specification, an accepted ADR or AGENTS.md; correctness, data-loss, concurrency
            and security bugs; missing tests for new behaviour. Skip style preferences and
            speculative concerns.

            For every finding, leave one inline comment on the line it is about, starting with a
            priority badge (P1 for bugs that lose or corrupt data or break a documented flow, P2
            otherwise), a one-line title, then the concrete inputs or state that make it fail and
            what should happen instead.

            Finish with one top-level PR comment starting with "Claude review:" followed by
            either "no issues found" or the number of findings by priority.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: Answer @claude
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Report missing Claude credential
        if: env.HAS_CLAUDE_CREDENTIAL != 'true'
        run: echo "::notice::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable Claude."

      - name: Checkout repository
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Answer with Claude
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
