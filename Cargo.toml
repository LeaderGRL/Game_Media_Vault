[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/connectors",
    "crates/infrastructure",
    "crates/cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
game-media-vault-application = { path = "crates/application" }
game-media-vault-connectors = { path = "crates/connectors" }
game-media-vault-domain = { path = "crates/domain" }
game-media-vault-infrastructure = { path = "crates/infrastructure" }
blake3 = "1.8"
keyring = "4.2"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
imagesize = "0.15"
lopdf = { version = "0.45", default-features = false }
pdfium-render = "0.9"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
encoding_rs = "0.8"
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
texting_robots = "0.2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Full debug info gave every test binary a PDB of 60 to 300 MB on Windows, tens of GB in all.
# The workspace's own crates keep line tables, so panics and backtraces still name files and
# lines; dependencies keep none. `CARGO_PROFILE_DEV_DEBUG=true` brings full debug info back to
# the workspace's crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
